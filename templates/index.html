<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtra | Login</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts (Inter font matches the screenshot perfectly) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0b10; /* Exact dark background */
            color: white;
            margin: 0;
            overflow: hidden;
        }

        .discord-btn {
            background-color: #5865F2;
        }
        
        .discord-btn:hover {
            background-color: #4752c4;
        }

        /* Left Side Purple Gem Glow Effect */
        .gem-glow {
            position: absolute;
            left: -15%;
            top: 50%;
            transform: translateY(-50%) rotate(15deg);
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, rgba(88, 101, 242, 0.12) 0%, rgba(0,0,0,0) 60%);
            filter: blur(40px);
            z-index: -1;
        }

        .gem-shape {
            position: absolute;
            left: 2%;
            top: 50%;
            transform: translateY(-50%) rotate(-10deg);
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, rgba(50, 40, 100, 0.2), rgba(20, 15, 40, 0.4));
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            box-shadow: inset 0 0 30px rgba(88, 101, 242, 0.1);
            z-index: -1;
            opacity: 0.7;
        }

        /* Hide gem on very small mobile screens */
        @media (max-width: 768px) {
            .gem-shape { display: none; }
            .gem-glow { left: -50%; top: 30%; width: 150vw; height: 150vw; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center relative">

    <!-- Background Decor -->
    <div class="gem-glow"></div>
    <div class="gem-shape"></div>

    <!-- Top Left Logo -->
    <div class="absolute top-6 left-6 flex items-center gap-2 text-xs font-bold tracking-wider text-gray-200">
        <!-- Moon Icon similar to screenshot -->
        <div class="w-5 h-5 bg-indigo-500/20 rounded-full flex items-center justify-center">
            <i class="fa-solid fa-moon text-[10px] text-indigo-400"></i>
        </div>
        XTRA
    </div>

    <!-- Main Content Container -->
    <div class="w-full flex justify-center md:justify-start md:ml-[15%] lg:ml-[25%] px-6">
        <div class="w-full max-w-[380px] z-10 text-left">
            
            <h1 class="text-[26px] font-bold mb-3 tracking-tight">Welcome Back</h1>
            
            <p class="text-sm text-gray-400 mb-8 leading-relaxed pr-4">
                Log in with your Discord account to access your dashboard and manage your servers with ease.
            </p>

            <!-- Login Button directly routing to your Flask /login route -->
            <a href="/login" class="discord-btn w-full py-3 rounded-[6px] flex items-center justify-center gap-3 text-sm font-medium transition-all shadow-md">
                <i class="fa-brands fa-discord text-lg"></i>
                Login with Discord
            </a>

            <p class="text-[10px] text-gray-500 mt-6 leading-relaxed">
                By logging in, you acknowledge that you have read, understood, and agree to be bound by our 
                <a href="#" class="text-[#5865F2] hover:underline">Terms of Service</a> and 
                <a href="#" class="text-[#5865F2] hover:underline">Privacy Policy</a>.
            </p>
            
        </div>
    </div>

</body>
  </html>
