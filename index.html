<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtra | The Ultimate Discord Bot</title>
    <!-- Tailwind CSS (Styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome (Icons) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0F172A; /* Dark Slate Background */
            color: white;
        }
        .discord-btn {
            background-color: #5865F2;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
        }
        .discord-btn:hover {
            background-color: #4752C4;
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.6);
            transform: translateY(-2px);
        }
        /* Background Glow Effects */
        .glow-circle-1 {
            position: absolute; top: -10%; left: -10%; width: 400px; height: 400px;
            background: rgba(59, 130, 246, 0.15); border-radius: 50%; filter: blur(100px); z-index: 0;
        }
        .glow-circle-2 {
            position: absolute; bottom: -10%; right: -10%; width: 400px; height: 400px;
            background: rgba(168, 85, 247, 0.15); border-radius: 50%; filter: blur(100px); z-index: 0;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
    
    <!-- Background Decor -->
    <div class="glow-circle-1"></div>
    <div class="glow-circle-2"></div>

    <!-- Main Content -->
    <div class="z-10 text-center px-6 max-w-3xl">
        
        <!-- Bot Icon (Aap iski jagah apne bot ke icon ka link daal sakte hain) -->
        <div class="mx-auto w-28 h-28 bg-gray-800 rounded-full flex items-center justify-center mb-6 border-4 border-gray-700 shadow-2xl">
            <i class="fas fa-robot text-5xl text-blue-400"></i>
        </div>
        
        <!-- Title -->
        <h1 class="text-4xl md:text-6xl font-bold mb-4 tracking-tight">
            Manage <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">Xtra</span> Bot
        </h1>
        
        <!-- Description -->
        <p class="text-gray-400 text-lg md:text-xl mb-8 leading-relaxed">
            The ultimate all-in-one Discord bot. Manage Automod, Leveling, Music, and 1000+ commands right from your web dashboard.
        </p>

        <!-- Feature Tags -->
        <div class="flex flex-wrap justify-center gap-3 mb-10 text-sm font-semibold">
            <span class="bg-gray-800 px-4 py-2 rounded-full border border-gray-700 shadow-sm">
                <i class="fas fa-shield-alt text-blue-400 mr-2"></i>Security
            </span>
            <span class="bg-gray-800 px-4 py-2 rounded-full border border-gray-700 shadow-sm">
                <i class="fas fa-gavel text-purple-400 mr-2"></i>Automod
            </span>
            <span class="bg-gray-800 px-4 py-2 rounded-full border border-gray-700 shadow-sm">
                <i class="fas fa-music text-pink-400 mr-2"></i>Music
            </span>
            <span class="bg-gray-800 px-4 py-2 rounded-full border border-gray-700 shadow-sm">
                <i class="fas fa-bolt text-yellow-400 mr-2"></i>Fast UI
            </span>
        </div>

        <!-- Login Button -->
        <a href="/login" class="inline-flex items-center justify-center discord-btn text-white px-8 py-4 rounded-xl text-lg font-bold transition-all duration-300">
            <i class="fab fa-discord text-2xl mr-3"></i>
            Login with Discord
        </a>
    </div>

    <!-- Footer -->
    <footer class="absolute bottom-6 text-gray-500 text-sm z-10">
        &copy; 2026 Xtra Devs. All rights reserved.
    </footer>

</body>
</html>
